<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Informatika Dasar - Paket Acak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #e0f2f1;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wadah {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #00695c;
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* === HALAMAN LOGIN === */
        .halaman-login {
            display: block;
        }
        .halaman-kuis, .halaman-hasil {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #004d40;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #b2dfdb;
            border-radius: 8px;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #00796b;
        }
        .btn-mulai {
            width: 100%;
            padding: 12px;
            background: #00796b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-mulai:hover {
            background: #004d40;
        }
        .pesan-error {
            color: #d32f2f;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }

        /* === HALAMAN KUIS === */
        .info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            background: #b2dfdb;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .identitas {
            width: 100%;
            font-size: 13px;
            color: #004d40;
            margin-bottom: 5px;
        }
        .paket-soal {
            background: #ffecb3;
            padding: 5px 10px;
            border-radius: 5px;
            color: #e65100;
        }

        .soal {
            background: #f1f8e9;
            padding: 18px;
            border-radius: 8px;
            border-left: 5px solid #558b2f;
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.6;
        }

        .pilihan {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tombol {
            padding: 12px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            background: #4fc3f7;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .tombol:hover:not(:disabled) {
            background: #0288d1;
            color: white;
            transform: translateX(3px);
        }

        .tombol:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #pesan {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        #tombolLanjut {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            display: none;
        }

        #tombolLanjut:hover {
            background: #f57c00;
        }

        /* === HALAMAN HASIL === */
        .halaman-hasil {
            text-align: center;
            padding: 20px;
        }
        .halaman-hasil h2 {
            color: #2e7d32;
            margin-bottom: 15px;
        }
        .skor {
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
            color: #00796b;
        }
        .btn-ulang {
            margin-top: 20px;
            padding: 12px 24px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-ulang:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>
    <div class="wadah">
        <!-- HALAMAN LOGIN -->
        <div class="halaman-login" id="halamanLogin">
            <h1>MASUK KUIS INFORMATIKA</h1>
            <div class="form-group">
                <label>Nama Lengkap Siswa</label>
                <input type="text" id="inputNama" placeholder="Masukkan nama kamu..." autocomplete="off">
            </div>
            <div class="form-group">
                <label>Kelas</label>
                <input type="text" id="inputKelas" placeholder="Contoh: X.1 / X.2 / XI / XII.1 / XII.2 ..." autocomplete="off">
            </div>
            <button class="btn-mulai" id="btnMulai">MULAI KUIS</button>
            <div class="pesan-error" id="pesanError">Lengkapi Nama dan Kelas terlebih dahulu!</div>
        </div>

        <!-- HALAMAN KUIS -->
        <div class="halaman-kuis" id="halamanKuis">
            <h1>PERMAINAN KUIS INFORMATIKA</h1>
            <div class="info">
                <div class="identitas">Nama: <span id="tampilNama"></span> | Kelas: <span id="tampilKelas"></span></div>
                <div class="paket-soal">Paket Soal: <span id="namaPaket"></span></div>
                <div>Poin: <span id="nilai">0</span></div>
                <div>Soal <span id="noSoal">1</span> / 10</div>
            </div>

            <div class="soal">
                <p id="teksSoal"></p>
            </div>

            <div class="pilihan" id="kotakPilihan"></div>
            <div id="pesan"></div>
            <button id="tombolLanjut">Soal Berikutnya</button>
        </div>

        <!-- HALAMAN HASIL -->
        <div class="halaman-hasil" id="halamanHasil">
            <h2>🎉 KUIS SELESAI!</h2>
            <p>Nama: <span id="hasilNama"></span></p>
            <p>Kelas: <span id="hasilKelas"></span></p>
            <p>Paket Soal: <span id="hasilPaket"></span></p>
            <div class="skor">Skor Kamu: <span id="skorAkhir"></span> / 10</div>
            <p id="pesanNilai"></p>
            <button class="btn-ulang" onclick="location.reload()">KERJAKAN ULANG</button>
        </div>
    </div>

    <script>
        // === 5 PAKET SOAL: A, B, C, D, E ===
        const paketSoal = {
            A: [
                { soal: "1. Manakah penulisan perintah include yang benar?", pilihan: ["A. <#include><nama_file>", "B. #include <nama_file>", "C. include <nama_file>", "D. #include nama_file", "E. Semua benar"], benar: 1 },
                { soal: "2. Apa fungsi utama variabel?", pilihan: ["A. Mempercantik tulisan", "B. Menyimpan data", "C. Menghapus file", "D. Mempercepat komputer", "E. Membuat rumit"], benar: 1 },
                { soal: "3. Penutup perintah bahasa C adalah...", pilihan: ["A. .", "B. ,", "C. ;", "D. :", "E. !"], benar: 2 },
                { soal: "4. Tag paragraf HTML adalah...", pilihan: ["A. <head>", "B. <p>", "C. <body>", "D. <h1>", "E. <div>"], benar: 1 },
                { soal: "5. Kepanjangan CSS adalah...", pilihan: ["A. Computer Style Sheet", "B. Cascading Style Sheet", "C. Create Simple Style", "D. Color Style", "E. Central Sheet"], benar: 1 },
                { soal: "6. Tipe data kalimat/kata adalah...", pilihan: ["A. Integer", "B. Float", "C. String", "D. Angka", "E. Bulat"], benar: 2 },
                { soal: "7. Logika benar/salah disebut...", pilihan: ["A. Matematika", "B. Algoritma", "C. Boolean", "D. Program", "E. Data"], benar: 2 },
                { soal: "8. Struktur percabangan adalah...", pilihan: ["A. for", "B. while", "C. if ... else", "D. ulang", "E. lanjut"], benar: 2 },
                { soal: "9. Fungsi tag <title> adalah...", pilihan: ["A. Judul besar", "B. Judul tab browser", "C. Garis bawah", "D. Warna", "E. Tersembunyi"], benar: 1 },
                { soal: "10. Langkah sistematis penyelesaian masalah...", pilihan: ["A. Program", "B. Kode", "C. Algoritma", "D. Sintaks", "E. Variabel"], benar: 2 }
            ],
            B: [
                { soal: "1. Bahasa pemrograman yang digunakan untuk membuat struktur halaman web adalah...", pilihan: ["A. CSS", "B. HTML", "C. Python", "D. Java", "E. C++"], benar: 1 },
                { soal: "2. Alat untuk mengubah kode program menjadi bahasa mesin adalah...", pilihan: ["A. Editor", "B. Kompiler", "C. Browser", "D. Sistem Operasi", "E. Penyimpanan"], benar: 1 },
                { soal: "3. Simbol yang digunakan untuk komentar satu baris di C++ adalah...", pilihan: ["A. //", "B. /*", "C. *", "D. #", "E. --"], benar: 0 },
                { soal: "4. Tag untuk membuat baris baru pada HTML adalah...", pilihan: ["A. <hr>", "B. <br>", "C. <tr>", "D. <td>", "E. <b>"], benar: 1 },
                { soal: "5. Properti CSS untuk mengubah warna latar belakang adalah...", pilihan: ["A. color", "B. background-color", "C. font-color", "D. bg-color", "E. shade"], benar: 1 },
                { soal: "6. Nilai bilangan bulat disebut tipe data...", pilihan: ["A. Float", "B. Char", "C. Integer", "D. String", "E. Boolean"], benar: 2 },
                { soal: "7. Perulangan yang pasti berjalan minimal satu kali adalah...", pilihan: ["A. for", "B. while", "C. do ... while", "D. if", "E. switch"], benar: 2 },
                { soal: "8. Singkatan dari HTTP adalah...", pilihan: ["A. Hyper Text Transfer Protocol", "B. High Tech Transfer Program", "C. Hyper Text Tag Protocol", "D. Home Tool Transfer Page", "E. Hyperlink Text Tech Page"], benar: 0 },
                { soal: "9. Fungsi utama komputer adalah memproses...", pilihan: ["A. Gambar", "B. Data/Informasi", "C. Suara", "D. Angka", "E. Teks"], benar: 1 },
                { soal: "10. Urutan pengerjaan instruksi dalam algoritma disebut...", pilihan: ["A. Percabangan", "B. Perulangan", "C. Runtunan", "D. Pemilihan", "E. Pengulangan"], benar: 2 }
            ],
            C: [
                { soal: "1. Bagian program yang berisi pendefinisian fungsi utama adalah...", pilihan: ["A. main()", "B. awal()", "C. mulai()", "D. fungsi()", "E. inti()"], benar: 0 },
                { soal: "2. Tag untuk membuat teks tebal pada HTML adalah...", pilihan: ["A. <i>", "B. <b>", "C. <u>", "D. <s>", "E. <p>"], benar: 1 },
                { soal: "3. Simbol yang digunakan untuk mengalikan angka adalah...", pilihan: ["A. x", "B. *", "C. /", "D. +", "E. %"], benar: 1 },
                { soal: "4. Kepanjangan dari URL adalah...", pilihan: ["A. Uniform Resource Locator", "B. Universal Resource Link", "C. Uniform Reference Locator", "D. Unified Resource Link", "E. Universal Reference Locator"], benar: 0 },
                { soal: "5. Properti CSS untuk mengatur jarak luar elemen adalah...", pilihan: ["A. padding", "B. margin", "C. border", "D. outline", "E. spacing"], benar: 1 },
                { soal: "6. Hasil dari operasi 10 % 3 adalah...", pilihan: ["A. 3", "B. 1", "C. 0", "D. 3,3", "E. 10"], benar: 1 },
                { soal: "7. Memilih satu dari banyak kondisi menggunakan...", pilihan: ["A. if", "B. switch", "C. for", "D. while", "E. do"], benar: 1 },
                { soal: "8. Perangkat keras yang berfungsi menyimpan data secara permanen adalah...", pilihan: ["A. RAM", "B. Harddisk", "C. Processor", "D. VGA", "E. Power Supply"], benar: 1 },
                { soal: "9. Dalam logika, nilai 1 berarti...", pilihan: ["A. Salah", "B. Benar", "C. Nol", "D. Kosong", "E. Min"], benar: 1 },
                { soal: "10. Kumpulan instruksi yang memerintah komputer disebut...", pilihan: ["A. Perangkat Keras", "B. Program", "C. Algoritma", "D. Data", "E. Sistem"], benar: 1 }
            ],
            D: [
                { soal: "1. Tag yang berisi informasi tentang halaman web adalah...", pilihan: ["A. <body>", "B. <head>", "C. <html>", "D. <title>", "E. <meta>"], benar: 1 },
                { soal: "2. Tipe data bilangan pecahan adalah...", pilihan: ["A. int", "B. float", "C. char", "D. string", "E. bool"], benar: 1 },
                { soal: "3. Operator untuk membandingkan kesamaan nilai adalah...", pilihan: ["A. =", "B. ==", "C. ===", "D. :", "E. ::="], benar: 1 },
                { soal: "4. Fungsi untuk menampilkan output di layar bahasa C++ adalah...", pilihan: ["A. cin", "B. cout", "C. print", "D. echo", "E. tulis"], benar: 1 },
                { soal: "5. Kepanjangan dari WWW adalah...", pilihan: ["A. World Wide Web", "B. Web World Wide", "C. Wide World Web", "D. World Web Wide", "E. Wide Web World"], benar: 0 },
                { soal: "6. Perintah untuk mengulang kode dengan batas pasti adalah...", pilihan: ["A. while", "B. for", "C. if", "D. goto", "E. switch"], benar: 1 },
                { soal: "7. Bagian komputer yang mengolah data adalah...", pilihan: ["A. RAM", "B. CPU", "C. Harddisk", "D. Monitor", "E. Keyboard"], benar: 1 },
                { soal: "8. Tag untuk membuat daftar bernomor urut adalah...", pilihan: ["A. <ul>", "B. <ol>", "C. <li>", "D. <dl>", "E. <dt>"], benar: 1 },
                { soal: "9. Properti CSS untuk mengatur ukuran tulisan adalah...", pilihan: ["A. font-style", "B. font-size", "C. font-weight", "D. text-size", "E. size-font"], benar: 1 },
                { soal: "10. Urutan langkah penyelesaian masalah yang logis disebut...", pilihan: ["A. Kode", "B. Algoritma", "C. Program", "D. Sintaks", "E. Variabel"], benar: 1 }
            ],
            E: [
                { soal: "1. Ekstensi file lembar gaya CSS adalah...", pilihan: ["A. .html", "B. .css", "C. .js", "D. .txt", "E. .exe"], benar: 1 },
                { soal: "2. Penulisan variabel yang benar di bawah ini adalah...", pilihan: ["A. var nama_saya", "B. var nama saya", "C. var nama-saya", "D. var 1nama", "E. var nama&saya"], benar: 0 },
                { soal: "3. Bagian yang terlihat oleh pengguna pada halaman web ada di dalam tag...", pilihan: ["A. <head>", "B. <body>", "C. <html>", "D. <title>", "E. <link>"], benar: 1 },
                { soal: "4. Kepanjangan dari LAN adalah...", pilihan: ["A. Local Area Network", "B. Large Area Network", "C. Local Access Net", "D. Link Area Network", "E. Local Area Net"], benar: 0 },
                { soal: "5. Operator logika DAN ditulis dengan...", pilihan: ["A. ||", "B. &&", "C. !", "D. &", "E. |"], benar: 1 },
                { soal: "6. Tag untuk menyisipkan gambar pada HTML adalah...", pilihan: ["A. <pic>", "B. <img>", "C. <photo>", "D. <gambar>", "E. <src>"], benar: 1 },
                { soal: "7. Apa yang dimaksud dengan perangkat lunak?", pilihan: ["A. Bagian fisik komputer", "B. Program/data yang tidak berwujud", "C. Kabel dan alat", "D. Monitor dan keyboard", "E. Semua benar"], benar: 1 },
                { soal: "8. Sintaks yang digunakan untuk mengubah gaya tulisan miring adalah...", pilihan: ["A. <b>", "B. <i>", "C. <u>", "D. <s>", "E. <p>"], benar: 1 },
                { soal: "9. Nilai yang tidak berubah selama program berjalan disebut...", pilihan: ["A. Variabel", "B. Konstanta", "C. Tipe Data", "D. Fungsi", "E. Objek"], benar: 1 },
                { soal: "10. Alat yang digunakan untuk mengetik data ke komputer adalah...", pilihan: ["A. Mouse", "B. Keyboard", "C. Monitor", "D. Printer", "E. Speaker"], benar: 1 }
            ]
        };

        // === VARIABEL ===
        let nomor = 0;
        let poin = 0;
        let namaSiswa = "";
        let kelasSiswa = "";
        let daftarSoalTerpilih = [];
        let namaPaketTerpilih = "";

        // === ELEMEN HALAMAN ===
        const halamanLogin = document.getElementById("halamanLogin");
        const halamanKuis = document.getElementById("halamanKuis");
        const halamanHasil = document.getElementById("halamanHasil");
        const inputNama = document.getElementById("inputNama");
        const inputKelas = document.getElementById("inputKelas");
        const btnMulai = document.getElementById("btnMulai");
        const pesanError = document.getElementById("pesanError");

        const tampilNama = document.getElementById("tampilNama");
        const tampilKelas = document.getElementById("tampilKelas");
        const tampilPaket = document.getElementById("namaPaket");
        const teksSoal = document.getElementById("teksSoal");
        const kotakPilihan = document.getElementById("kotakPilihan");
        const nilai = document.getElementById("nilai");
        const noSoal = document.getElementById("noSoal");
        const pesan = document.getElementById("pesan");
        const tombolLanjut = document.getElementById("tombolLanjut");

        const hasilNama = document.getElementById("hasilNama");
        const hasilKelas = document.getElementById("hasilKelas");
        const hasilPaket = document.getElementById("hasilPaket");
        const skorAkhir = document.getElementById("skorAkhir");
        const pesanNilai = document.getElementById("pesanNilai");

        // === FUNGSI PILIH PAKET SECARA ACAK ===
        function pilihPaketAcak() {
            const daftarKunci = Object.keys(paketSoal); // ['A','B','C','D','E']
            const indeksAcak = Math.floor(Math.random() * daftarKunci.length);
            namaPaketTerpilih = daftarKunci[indeksAcak];
            daftarSoalTerpilih = paketSoal[namaPaketTerpilih];
        }

        // === FUNGSI MULAI KUIS ===
        btnMulai.addEventListener("click", () => {
            namaSiswa = inputNama.value.trim();
            kelasSiswa = inputKelas.value.trim();

            if (namaSiswa === "" || kelasSiswa === "") {
                pesanError.style.display = "block";
                return;
            }

            // PILIH PAKET SEKARANG
            pilihPaketAcak();

            pesanError.style.display = "none";
            halamanLogin.style.display = "none";
            halamanKuis.style.display = "block";
            tampilNama.textContent = namaSiswa;
            tampilKelas.textContent = kelasSiswa;
            tampilPaket.textContent = namaPaketTerpilih;
            tampilSoal();
        });

        // === TAMPILKAN SOAL ===
        function tampilSoal() {
            const soalSekarang = daftarSoalTerpilih[nomor];
            teksSoal.textContent = soalSekarang.soal;
            kotakPilihan.innerHTML = "";
            pesan.style.display = "none";
            tombolLanjut.style.display = "none";
            noSoal.textContent = nomor + 1;

            soalSekarang.pilihan.forEach((pilih, idx) => {
                const btn = document.createElement("button");
                btn.className = "tombol";
                btn.textContent = pilih;
                btn.onclick = () => cekJawaban(idx, btn);
                kotakPilihan.appendChild(btn);
            });
        }

        // === CEK JAWABAN ===
        function cekJawaban(pilihanUser, tombolPilih) {
            const semuaTombol = document.querySelectorAll(".tombol");
            semuaTombol.forEach(b => b.disabled = true);
            pesan.style.display = "block";

            if (pilihanUser === daftarSoalTerpilih[nomor].benar) {
                poin++;
                nilai.textContent = poin;
                pesan.textContent = "✅ JAWABAN BENAR! Poin bertambah 1";
                pesan.style.background = "#c8e6c9";
                pesan.style.color = "#2e7d32";
                tombolPilih.style.background = "#4caf50";
            } else {
                pesan.textContent = "❌ JAWABAN SALAH";
                pesan.style.background = "#ffcdd2";
                pesan.style.color = "#c62828";
                tombolPilih.style.background = "#f44336";
                semuaTombol[daftarSoalTerpilih[nomor].benar].style.background = "#4caf50";
            }

            tombolLanjut.style.display = "block";
        }

        // === TOMBOL LANJUT ===
        tombolLanjut.onclick = () => {
            nomor++;
            if (nomor < daftarSoalTerpilih.length) {
                tampilSoal();
            } else {
                tampilHasil();
            }
        };

        // === TAMPILKAN HASIL AKHIR ===
        function tampilHasil() {
            halamanKuis.style.display = "none";
            halamanHasil.style.display = "block";
            hasilNama.textContent = namaSiswa;
            hasilKelas.textContent = kelasSiswa;
            hasilPaket.textContent = namaPaketTerpilih;
            skorAkhir.textContent = poin;

            if (poin >= 8) pesanNilai.textContent = "🌟 Luar biasa! Penguasaan materi sangat baik.";
            else if (poin >= 6) pesanNilai.textContent = "👍 Bagus! Tingkatkan lagi pemahamanmu.";
            else pesanNilai.textContent = "💪 Semangat belajar lagi ya, pasti bisa lebih baik!";
        }
    </script>
</body>
</html>
