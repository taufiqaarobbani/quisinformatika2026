<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Informatika Dasar - Paket Acak</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #e0f2f1;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wadah {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #00695c;
            margin-bottom: 20px;
            font-size: 22px;
        }

        /* === HALAMAN LOGIN === */
        .halaman-login {
            display: block;
        }
        .halaman-kuis, .halaman-hasil {
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #004d40;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #b2dfdb;
            border-radius: 8px;
            font-size: 15px;
            background: white;
            cursor: pointer;
        }
        select:focus, input:focus {
            outline: none;
            border-color: #00796b;
        }
        .btn-mulai {
            width: 100%;
            padding: 12px;
            background: #00796b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-mulai:hover {
            background: #004d40;
        }
        .pesan-error {
            color: #d32f2f;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }
        .sembunyi {
            display: none;
        }

        /* === HALAMAN KUIS === */
        .info {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            background: #b2dfdb;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .identitas {
            width: 100%;
            font-size: 13px;
            color: #004d40;
            margin-bottom: 5px;
        }
        .paket-soal {
            background: #ffecb3;
            padding: 5px 10px;
            border-radius: 5px;
            color: #e65100;
        }

        .soal {
            background: #f1f8e9;
            padding: 18px;
            border-radius: 8px;
            border-left: 5px solid #558b2f;
            margin-bottom: 20px;
            font-size: 16px;
            line-height: 1.6;
        }

        .pilihan {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .tombol {
            padding: 12px;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            background: #4fc3f7;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .tombol:hover:not(:disabled) {
            background: #0288d1;
            color: white;
            transform: translateX(3px);
        }

        .tombol:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #pesan {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        #tombolLanjut {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            display: none;
        }

        #tombolLanjut:hover {
            background: #f57c00;
        }

        /* === HALAMAN HASIL === */
        .halaman-hasil {
            text-align: center;
            padding: 20px;
        }
        .halaman-hasil h2 {
            color: #2e7d32;
            margin-bottom: 15px;
        }
        .skor {
            font-size: 28px;
            font-weight: bold;
            margin: 15px 0;
            color: #00796b;
        }
        .btn-ulang {
            margin-top: 20px;
            padding: 12px 24px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-ulang:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>
    <div class="wadah">
        <!-- HALAMAN LOGIN -->
        <div class="halaman-login" id="halamanLogin">
            <h1>MASUK KUIS INFORMATIKA</h1>
            <div class="form-group">
                <label>Nama Lengkap Siswa</label>
                <select id="pilihNama">
                    <option value="">-- Pilih Nama --</option>
                    <option value="Andi">Andi</option>
                    <option value="Ernando">Ernando</option>
                    <option value="Mustopa">Mustopa</option>
                    <option value="Rohman">Rohman</option>
                    <option value="lainnya">Lainnya...</option>
                </select>
            </div>
            <div class="form-group sembunyi" id="kolomNamaLain">
                <label>Tuliskan Nama Kamu</label>
                <input type="text" id="inputNamaLain" placeholder="Masukkan nama lengkapmu..." autocomplete="off">
            </div>
            <div class="form-group">
                <label>Kelas</label>
                <select id="inputKelas">
                    <option value="">-- Pilih Kelas --</option>
                    <option value="X.1">X.1</option>
                    <option value="X.2">X.2</option>
                    <option value="XI">XI</option>
                    <option value="XII.1">XII.1</option>
                    <option value="XII.2">XII.2</option>
                </select>
            </div>
            <button class="btn-mulai" id="btnMulai">MULAI KUIS</button>
            <div class="pesan-error" id="pesanError">Silakan Pilih Nama dan Kelas terlebih dahulu!</div>
        </div>

        <!-- HALAMAN KUIS -->
        <div class="halaman-kuis" id="halamanKuis">
            <h1>PERMAINAN KUIS INFORMATIKA</h1>
            <div class="info">
                <div class="identitas">Nama: <span id="tampilNama"></span> | Kelas: <span id="tampilKelas"></span></div>
                <div class="paket-soal">Paket Soal: <span id="namaPaket"></span></div>
                <div>Poin: <span id="nilai">0</span></div>
                <div>Soal <span id="noSoal">1</span> / 10</div>
            </div>

            <div class="soal">
                <p id="teksSoal"></p>
            </div>

            <div class="pilihan" id="kotakPilihan"></div>
            <div id="pesan"></div>
            <button id="tombolLanjut">Soal Berikutnya</button>
        </div>

        <!-- HALAMAN HASIL -->
        <div class="halaman-hasil" id="halamanHasil">
            <h2>🎉 KUIS SELESAI!</h2>
            <p>Nama: <span id="hasilNama"></span></p>
            <p>Kelas: <span id="hasilKelas"></span></p>
            <p>Paket Soal: <span id="hasilPaket"></span></p>
            <div class="skor">Skor Kamu: <span id="skorAkhir"></span> / 10</div>
            <p id="pesanNilai"></p>
            <button class="btn-ulang" onclick="location.reload()">KERJAKAN ULANG</button>
        </div>
    </div>

    <script>
        // === 5 PAKET SOAL: A, B, C, D, E ===
        const paketSoal = {
            A: [
        { soal: "1. Manakah penulisan perintah include pustaka standar yang benar pada C++?", pilihan: ["A. <#include><nama_file>", "B. #include <iostream>", "C. include <iostream>", "D. #include iostream", "E. Semua benar"], benar: 1 },
        { soal: "2. Apa fungsi utama dari variabel dalam pemrograman C++?", pilihan: ["A. Mempercantik tampilan kode", "B. Menyimpan data sementara", "C. Menghapus file sistem", "D. Mempercepat komputer", "E. Membuat program rumit"], benar: 1 },
        { soal: "3. Tanda yang wajib digunakan untuk mengakhiri setiap perintah pada C++ adalah...", pilihan: ["A. Titik (.)", "B. Koma (,)", "C. Titik Koma (;)", "D. Titik Dua (:)", "E. Tanda Seru (!)"], benar: 2 },
        { soal: "4. Fungsi utama sebagai pintu masuk awal program C++ adalah...", pilihan: ["A. mulai()", "B. main()", "C. awal()", "D. fungsi()", "E. inti()"], benar: 1 },
        { soal: "5. Manakah perintah yang benar untuk menampilkan output ke layar pada C++?", pilihan: ["A. cin >>", "B. cout <<", "C. print(", "D. echo ", "E. tampilkan("], benar: 1 },
        { soal: "6. Tipe data yang digunakan untuk menyimpan data berupa satu huruf atau karakter adalah...", pilihan: ["A. int", "B. float", "C. char", "D. double", "E. bool"], benar: 2 },
        { soal: "7. Tipe data yang hanya memiliki dua nilai yaitu benar atau salah disebut...", pilihan: ["A. Bilangan Bulat", "B. Pecahan", "C. Boolean", "D. Karakter", "E. String"], benar: 2 },
        { soal: "8. Struktur kendali yang digunakan untuk mengambil keputusan atau percabangan kondisi adalah...", pilihan: ["A. for", "B. while", "C. if ... else", "D. do", "E. loop"], benar: 2 },
        { soal: "9. Simbol yang digunakan untuk memberi komentar satu baris pada C++ adalah...", pilihan: ["A. &", "B. //", "C. *", "D. #", "E. --"], benar: 1 },
        { soal: "10. Langkah atau urutan penyelesaian masalah secara sistematis dan logis disebut...", pilihan: ["A. Kode Program", "B. Bahasa Mesin", "C. Algoritma", "D. Sintaks", "E. Variabel"], benar: 2 }
    ],
    B: [
        { soal: "1. Kepanjangan dari nama bahasa pemrograman C++ adalah...", pilihan: ["A. C Plus Plus", "B. C Tambah", "C. C Pro", "D. C Modern", "E. C Lanjutan"], benar: 0 },
        { soal: "2. Bagian yang berfungsi untuk memasukkan data dari keyboard pada C++ adalah...", pilihan: ["A. cout", "B. cin", "C. print", "D. input", "E. scanf"], benar: 1 },
        { soal: "3. Tipe data yang digunakan untuk menyimpan bilangan desimal atau pecahan adalah...", pilihan: ["A. int", "B. float", "C. char", "D. string", "E. void"], benar: 1 },
        { soal: "4. Operator yang digunakan untuk membandingkan apakah dua nilai sama besar adalah...", pilihan: ["A. =", "B. ==", "C. >", "D. <", "E. !="], benar: 1 },
        { soal: "5. Manakah yang termasuk operator aritmatika perkalian pada C++?", pilihan: ["A. x", "B. *", "C. .", "D. X", "E. ^"], benar: 1 },
        { soal: "6. Perulangan yang paling tepat digunakan jika jumlah pengulangan sudah diketahui pasti adalah...", pilihan: ["A. if", "B. for", "C. while", "D. do while", "E. switch"], benar: 1 },
        { soal: "7. Hasil dari operasi hitung 15 % 4 adalah...", pilihan: ["A. 3", "B. 1", "C. 2", "D. 4", "E. 0"], benar: 1 },
        { soal: "8. Fungsi dari kata kunci 'int' pada awal penulisan fungsi main() adalah...", pilihan: ["A. Fungsi berupa teks", "B. Mengembalikan nilai bilangan bulat", "C. Fungsi berjalan cepat", "D. Fungsi utama", "E. Mengembalikan nilai kosong"], benar: 1 },
        { soal: "9. Operator logika yang menyatakan 'Dua kondisi harus benar semuanya' adalah...", pilihan: ["A. ||", "B. &&", "C. !", "D. or", "E. not"], benar: 1 },
        { soal: "10. Program yang berfungsi mengubah kode bahasa pemrograman ke bahasa mesin disebut...", pilihan: ["A. Editor", "B. Kompiler", "C. Debugger", "D. Linker", "E. Loader"], benar: 1 }
    ],
    C: [
        { soal: "1. Manakah penulisan deklarasi variabel yang benar pada C++?", pilihan: ["A. nama int umur", "B. int umur", "C. umur int", "D. int = umur", "E. umur : int"], benar: 1 },
        { soal: "2. Simbol yang digunakan untuk menambahkan nilai pada variabel adalah...", pilihan: ["A. *", "B. +", "C. &", "D. $", "E. @"], benar: 1 },
        { soal: "3. Pernyataan yang benar mengenai variabel adalah...", pilihan: ["A. Isinya tidak pernah berubah", "B. Namanya boleh diawali angka", "C. Isinya bisa berubah saat program berjalan", "D. Sama seperti konstanta", "E. Hanya boleh berisi angka"], benar: 2 },
        { soal: "4. Struktur percabangan yang digunakan untuk memilih banyak pilihan nilai tetap adalah...", pilihan: ["A. if", "B. switch", "C. for", "D. while", "E. else"], benar: 1 },
        { soal: "5. Perulangan yang akan menjalankan perintah terlebih dahulu baru mengecek syarat adalah...", pilihan: ["A. for", "B. while", "C. do ... while", "D. if ... else", "E. break"], benar: 2 },
        { soal: "6. Fungsi dari tanda kurung kurawal { } pada kode C++ adalah...", pilihan: ["A. Menulis komentar", "B. Membatasi blok perintah", "C. Mengakhiri perintah", "D. Memisahkan data", "E. Memulai program"], benar: 1 },
        { soal: "7. Kata kunci yang digunakan untuk menghentikan perulangan secara paksa adalah...", pilihan: ["A. stop", "B. break", "C. end", "D. exit", "E. tutup"], benar: 1 },
        { soal: "8. Manakah yang bukan merupakan tipe data dasar pada C++?", pilihan: ["A. int", "B. float", "C. char", "D. text", "E. bool"], benar: 3 },
        { soal: "9. Jika ingin membuat variabel yang nilainya tidak boleh diubah disebut...", pilihan: ["A. variabel", "B. konstanta", "C. tipe data", "D. fungsi", "E. kelas"], benar: 1 },
        { soal: "10. Urutan yang benar dalam pembuatan program adalah...", pilihan: ["A. Koding -> Algoritma -> Eksekusi", "B. Algoritma -> Koding -> Kompilasi -> Eksekusi", "C. Kompilasi -> Algoritma -> Koding", "D. Eksekusi -> Koding -> Algoritma", "E. Koding -> Eksekusi -> Algoritma"], benar: 1 }
    ],
    D: [
        { soal: "1. Pustaka yang wajib disertakan jika menggunakan cin dan cout adalah...", pilihan: ["A. #include <math.h>", "B. #include <iostream>", "C. #include <string>", "D. #include <stdio.h>", "E. #include <conio.h>"], benar: 1 },
        { soal: "2. Cara penulisan operator penugasan untuk menambah nilai variabel a sebesar 5 adalah...", pilihan: ["A. a = 5", "B. a += 5", "C. +a = 5", "D. a =+ 5", "E. a = 5 +"], benar: 1 },
        { soal: "3. Hasil dari 10 / 4 jika menggunakan tipe data int adalah...", pilihan: ["A. 2.5", "B. 2", "C. 3", "D. 0", "E. 4"], benar: 1 },
        { soal: "4. Kata kunci 'using namespace std;' berfungsi agar...", pilihan: ["A. Program berjalan cepat", "B. Tidak perlu menulis std:: sebelum cin/cout", "C. Program lebih aman", "D. Bisa menyertakan file lain", "E. Bisa berjalan di semua OS"], benar: 1 },
        { soal: "5. Manakah yang merupakan contoh operator logika 'Bukan/Tidak'?", pilihan: ["A. &&", "B. ||", "C. !", "D. &", "E. |"], benar: 2 },
        { soal: "6. Tipe data yang memiliki jangkauan nilai pecahan lebih besar dari float adalah...", pilihan: ["A. int", "B. char", "C. double", "D. long", "E. short"], benar: 2 },
        { soal: "7. Bagian yang berisi nama fungsi, tipe kembalian, dan parameter disebut...", pilihan: ["A. Isi fungsi", "B. Deklarasi/Penjelmaan fungsi", "C. Pemanggilan fungsi", "D. Isi program", "E. Badan fungsi"], benar: 1 },
        { soal: "8. Simbol << pada cout berfungsi sebagai...", pilihan: ["A. Operator maju", "B. Operator penyisipan", "C. Operator pengurangan", "D. Operator pembanding", "E. Operator penjumlahan"], benar: 1 },
        { soal: "9. Jika kondisi pada pernyataan if bernilai salah, maka perintah yang akan dijalankan ada pada bagian...", pilihan: ["A. if", "B. else", "C. for", "D. while", "E. switch"], benar: 1 },
        { soal: "10. Sintaks yang digunakan untuk memberikan nilai awal pada variabel disebut...", pilihan: ["A. Pendeklarasian", "B. Inisialisasi", "C. Pengubahan", "D. Penghapusan", "E. Penggunaan"], benar: 1 }
    ],
    E: [
        { soal: "1. Ekstensi file kode program C++ yang benar adalah...", pilihan: ["A. .c", "B. .cpp", "C. .java", "D. .py", "E. .cs"], benar: 1 },
        { soal: "2. Manakah nama variabel yang penulisannya tidak diperbolehkan pada C++?", pilihan: ["A. nama_siswa", "B. nama siswa", "C. NamaSiswa", "D. nama123", "E. _nama"], benar: 1 },
        { soal: "3. Fungsi dari operator != adalah...", pilihan: ["A. Sama dengan", "B. Tidak sama dengan", "C. Lebih besar", "D. Lebih kecil", "E. Lebih besar sama dengan"], benar: 1 },
        { soal: "4. Pernyataan yang tepat mengenai tipe data bool adalah...", pilihan: ["A. Menyimpan huruf", "B. Menyimpan benar atau salah", "C. Menyimpan bilangan bulat", "D. Menyimpan bilangan pecahan", "E. Menyimpan kalimat"], benar: 1 },
        { soal: "5. Kata kunci yang digunakan untuk mengembalikan nilai pada fungsi adalah...", pilihan: ["A. kembali", "B. return", "C. balikin", "D. hasil", "E. end"], benar: 1 },
        { soal: "6. Di dalam fungsi main(), pernyataan 'return 0;' artinya...", pilihan: ["A. Program error", "B. Program berakhir normal", "C. Program berhenti paksa", "D. Program mengulang", "E. Program menunggu"], benar: 1 },
        { soal: "7. Manakah yang termasuk contoh operator penugasan?", pilihan: ["A. +", "B. =", "C. >", "D. &&", "E. /"], benar: 1 },
        { soal: "8. Jika kita ingin membuat variabel yang bisa menampung banyak karakter atau kalimat, kita menggunakan...", pilihan: ["A. char", "B. string", "C. int", "D. float", "E. bool"], benar: 1 },
        { soal: "9. Bagian program yang tidak akan dieksekusi oleh komputer adalah...", pilihan: ["A. cout", "B. Komentar", "C. cin", "D. main()", "E. variabel"], benar: 1 },
        { soal: "10. Urutan langkah pengerjaan operasi hitung pada C++ mengikuti aturan...", pilihan: ["A. Dari kiri ke kanan saja", "B. Prioritas operator (kurung, kali/bagi, tambah/kurang)", "C. Dari kanan ke kiri", "D. Acak", "E. Terakhir ditulis pertama dikerjakan"], benar: 1 }
    ]
};

        // === VARIABEL ===
        let nomor = 0;
        let poin = 0;
        let namaSiswa = "";
        let kelasSiswa = "";
        let daftarSoalTerpilih = [];
        let namaPaketTerpilih = "";

        // === ELEMEN HALAMAN ===
        const halamanLogin = document.getElementById("halamanLogin");
        const halamanKuis = document.getElementById("halamanKuis");
        const halamanHasil = document.getElementById("halamanHasil");
        const pilihNama = document.getElementById("pilihNama");
        const kolomNamaLain = document.getElementById("kolomNamaLain");
        const inputNamaLain = document.getElementById("inputNamaLain");
        const inputKelas = document.getElementById("inputKelas");
        const btnMulai = document.getElementById("btnMulai");
        const pesanError = document.getElementById("pesanError");

        const tampilNama = document.getElementById("tampilNama");
        const tampilKelas = document.getElementById("tampilKelas");
        const tampilPaket = document.getElementById("namaPaket");
        const teksSoal = document.getElementById("teksSoal");
        const kotakPilihan = document.getElementById("kotakPilihan");
        const nilai = document.getElementById("nilai");
        const noSoal = document.getElementById("noSoal");
        const pesan = document.getElementById("pesan");
        const tombolLanjut = document.getElementById("tombolLanjut");

        const hasilNama = document.getElementById("hasilNama");
        const hasilKelas = document.getElementById("hasilKelas");
        const hasilPaket = document.getElementById("hasilPaket");
        const skorAkhir = document.getElementById("skorAkhir");
        const pesanNilai = document.getElementById("pesanNilai");

        // === TAMPIL/Sembunyikan KOLOM NAMA LAINNYA ===
        pilihNama.addEventListener("change", () => {
            if (pilihNama.value === "lainnya") {
                kolomNamaLain.classList.remove("sembunyi");
                inputNamaLain.focus();
            } else {
                kolomNamaLain.classList.add("sembunyi");
                inputNamaLain.value = "";
            }
        });

        // === FUNGSI PILIH PAKET SECARA ACAK ===
        function pilihPaketAcak() {
            const daftarKunci = Object.keys(paketSoal);
            const indeksAcak = Math.floor(Math.random() * daftarKunci.length);
            namaPaketTerpilih = daftarKunci[indeksAcak];
            daftarSoalTerpilih = paketSoal[namaPaketTerpilih];
        }

        // === FUNGSI MULAI KUIS ===
        btnMulai.addEventListener("click", () => {
            // Ambil nama sesuai pilihan
            if (pilihNama.value === "lainnya") {
                namaSiswa = inputNamaLain.value.trim();
            } else {
                namaSiswa = pilihNama.value.trim();
            }
            kelasSiswa = inputKelas.value.trim();

            // Validasi
            if (namaSiswa === "" || kelasSiswa === "") {
                pesanError.textContent = pilihNama.value === "lainnya" && namaSiswa === ""
                    ? "Silakan TULIS nama lengkapmu terlebih dahulu!"
                    : "Silakan Pilih Nama dan Kelas terlebih dahulu!";
                pesanError.style.display = "block";
                return;
            }

            pilihPaketAcak();

            pesanError.style.display = "none";
            halamanLogin.style.display = "none";
            halamanKuis.style.display = "block";
            tampilNama.textContent = namaSiswa;
            tampilKelas.textContent = kelasSiswa;
            tampilPaket.textContent = namaPaketTerpilih;
            tampilSoal();
        });

        // === TAMPILKAN SOAL ===
        function tampilSoal() {
            const soalSekarang = daftarSoalTerpilih[nomor];
            teksSoal.textContent = soalSekarang.soal;
            kotakPilihan.innerHTML = "";
            pesan.style.display = "none";
            tombolLanjut.style.display = "none";
            noSoal.textContent = nomor + 1;

            soalSekarang.pilihan.forEach((pilih, idx) => {
                const btn = document.createElement("button");
                btn.className = "tombol";
                btn.textContent = pilih;
                btn.onclick = () => cekJawaban(idx, btn);
                kotakPilihan.appendChild(btn);
            });
        }

        // === CEK JAWABAN ===
        function cekJawaban(pilihanUser, tombolPilih) {
            const semuaTombol = document.querySelectorAll(".tombol");
            semuaTombol.forEach(b => b.disabled = true);
            pesan.style.display = "block";

            if (pilihanUser === daftarSoalTerpilih[nomor].benar) {
                poin++;
                nilai.textContent = poin;
                pesan.textContent = "✅ JAWABAN BENAR! Poin bertambah 1";
                pesan.style.background = "#c8e6c9";
                pesan.style.color = "#2e7d32";
                tombolPilih.style.background = "#4caf50";
            } else {
                pesan.textContent = "❌ JAWABAN SALAH";
                pesan.style.background = "#ffcdd2";
                pesan.style.color = "#c62828";
                tombolPilih.style.background = "#f44336";
                semuaTombol[daftarSoalTerpilih[nomor].benar].style.background = "#4caf50";
            }

            tombolLanjut.style.display = "block";
        }

        // === TOMBOL LANJUT ===
        tombolLanjut.onclick = () => {
            nomor++;
            if (nomor < daftarSoalTerpilih.length) {
                tampilSoal();
            } else {
                tampilHasil();
            }
        };

        // === TAMPILKAN HASIL AKHIR ===
        function tampilHasil() {
            halamanKuis.style.display = "none";
            halamanHasil.style.display = "block";
            hasilNama.textContent = namaSiswa;
            hasilKelas.textContent = kelasSiswa;
            hasilPaket.textContent = namaPaketTerpilih;
            skorAkhir.textContent = poin;

            if (poin >= 8) pesanNilai.textContent = "🌟 Luar biasa! Penguasaan materi sangat baik.";
            else if (poin >= 6) pesanNilai.textContent = "👍 Bagus! Tingkatkan lagi pemahamanmu.";
            else pesanNilai.textContent = "💪 Semangat belajar lagi ya, pasti bisa lebih baik!";
        }
    </script>
</body>
</html>
